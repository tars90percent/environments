version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      codex:
        patterns:
          - "@openai/codex*"
      lark:
        patterns:
          - "@larksuite/*"
      development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
