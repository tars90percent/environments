name: CASE CI

on:
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - apps/case/**
      - packages/**
      - .github/workflows/case-ci.yml
  pull_request:
    paths:
      - AGENTS.md
      - apps/case/**
      - packages/**
      - .github/workflows/case-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: case_test
          POSTGRES_PASSWORD: case_test
          POSTGRES_DB: case_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U case_test -d case_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CASE_REGISTRY_TEST_DATABASE_URL: postgresql://case_test:case_test@127.0.0.1:5432/case_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/case/package-lock.json

      - name: Install dependencies
        working-directory: apps/case
        run: npm ci

      - name: Type-check
        working-directory: apps/case
        run: npm run check

      - name: Test
        working-directory: apps/case
        run: npm test

      - name: Build
        working-directory: apps/case
        run: npm run build

      - name: Build deployment image
        run: docker build --file apps/case/Dockerfile --tag case:test .

      - name: Check installed runtime tools without credentials or network
        run: docker run --rm --network none --entrypoint node case:test scripts/runtime-smoke.mjs
