name: Harbor Task Gateway CI

on:
  push:
    branches: [main]
    paths:
      - apps/harbor-task-gateway/**
      - .github/workflows/harbor-task-gateway-ci.yml
  pull_request:
    paths:
      - apps/harbor-task-gateway/**
      - .github/workflows/harbor-task-gateway-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/harbor-task-gateway/package-lock.json
      - run: npm ci
        working-directory: apps/harbor-task-gateway
      - run: npm test
        working-directory: apps/harbor-task-gateway
