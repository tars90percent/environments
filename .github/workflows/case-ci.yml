name: CASE CI

on:
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - apps/case/**
      - packages/**
      - .github/workflows/case-ci.yml
  pull_request:
    paths:
      - AGENTS.md
      - apps/case/**
      - packages/**
      - .github/workflows/case-ci.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/case/package-lock.json

      - name: Install dependencies
        working-directory: apps/case
        run: npm ci

      - name: Type-check
        working-directory: apps/case
        run: npm run check

      - name: Test
        working-directory: apps/case
        run: npm test

      - name: Build
        working-directory: apps/case
        run: npm run build

      - name: Build deployment image
        run: docker build --file apps/case/Dockerfile --tag case:test .
