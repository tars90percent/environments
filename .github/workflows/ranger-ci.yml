name: RANGER CI

on:
  push:
    branches: [main]
    paths: [apps/ranger/**, AGENTS.md, .github/workflows/ranger-ci.yml]
  pull_request:
    paths: [apps/ranger/**, AGENTS.md, .github/workflows/ranger-ci.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ranger/package-lock.json
      - name: Install pinned dependencies
        working-directory: apps/ranger
        run: |
          npm ci --ignore-scripts
          node node_modules/@larksuite/cli/scripts/install.js
      - name: Validate runtime
        working-directory: apps/ranger
        run: |
          npm run check
          npm test
          npm run build
          npm run smoke
      - name: Validate service unit
        run: systemd-analyze verify apps/ranger/deploy/ranger.service
